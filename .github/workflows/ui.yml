# ui/ CI (PRD §16 M3): the engine suite and the ui sub-product suites in one
# pipeline. The faux e2e (`npm --prefix ui run test:e2e`) drives the real CLI
# through plan / run / diffs / live-diff / 409 paths — it sets KIT_FAUX=1 and
# KIT_FAUX_SCRIPT=smoke.replay itself and needs no provider keys. It spawns the
# kit's built `dist/cli.js`, so the ui job builds the kit first.
name: ui

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: engine (root kit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # v22.x — the engine requires >= 22.19
      - name: Install (root lockfile; the ui never touches the kit's dep footprint)
        run: npm ci
      - name: Engine tests (durability + guard/breaker + ui-seam suites)
        run: npm test
      - name: Engine build
        run: npm run build

  ui:
    name: ui (sub-product, incl. faux e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # the ui package requires >= 22.19
      - name: Build the kit CLI (the faux e2e spawns the real dist/cli.js)
        run: npm ci && npm run build
      - name: Install ui (its own lockfile; never a root workspace)
        run: npm --prefix ui ci
      - name: Unit + contract + component tests
        run: npm --prefix ui test
      - name: Typecheck (server + client lib, kit sources included)
        run: npm --prefix ui run typecheck
      - name: svelte-check
        run: npm --prefix ui run check
      - name: Client build
        run: npm --prefix ui run build
      - name: "Faux e2e (real CLI: plan/run, diffs, live diff, 409)"
        run: npm --prefix ui run test:e2e
